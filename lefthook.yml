# Git hooks for the local-first CI flow. Activate once per clone: `lefthook install`.
# Block style only: `{staged_files}` inside a `{ ... }` flow mapping is invalid YAML.
pre-commit:
  parallel: true
  commands:
    secrets:
      run: gitleaks git --staged --redact --no-banner
    shell:
      glob: "*.sh"
      run: shellcheck {staged_files}
    workflows:
      glob: ".github/workflows/*.yml"
      run: actionlint {staged_files}
pre-push:
  commands:
    ci:
      # git exports GIT_DIR and its siblings to a hook. SwiftPM checks its dependencies out with git,
      # so in a tree that has never been built that environment makes the checkout act on THIS
      # repository and fail ("unable to read tree"); the red-first gate's throwaway parent worktree is
      # always such a tree. Drop git's local environment before anything builds (#260).
      run: unset $(git rev-parse --local-env-vars); just ci   # the full serial suite; never skipped with --no-verify (AGENTS.md)
