# zizmor: workflow security lint, run by `just workflows` and by just-ci.yml's `workflow-lint: true`
# (CHEATSHEET R14). REQUIRED in every repo with fmasi/.github callers: without it zizmor reports each
# `fmasi/...@main` as a high-severity unpinned-uses, and CI fails. Found at .github/zizmor.yml.
rules:
  unpinned-uses:
    config:
      policies:
        # The owner's reusable workflows track @main on purpose (R10: one place to fix).
        # Setting any policy replaces zizmor's defaults, so every other action must be SHA-pinned.
        "fmasi/*": ref-pin
  dangerous-triggers:
    # claude.yml listens on issue_comment so `@claude` works on PRs and issues. The reusable
    # workflow it calls (fmasi/.github claude-mention.yml) runs only when the author is an OWNER,
    # MEMBER or COLLABORATOR (R2), so a stranger's comment does nothing. zizmor 1.32 reports this
    # trigger as high; CI's pinned 1.30.1 did not.
    ignore:
      - claude.yml:9   # the `issue_comment` trigger line only, never the whole file
