name: Tests

on:
  push:
    branches: [main]
  # `ready_for_review` is listed because both jobs skip draft PRs (see their `if`): a draft is the
  # local-work phase (`just ci`), and marking it ready (`gh pr ready`) is what runs this workflow.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Least privilege: these jobs only read the repo.
permissions:
  contents: read

# One live run per branch. Without this every push started another set of three macOS jobs and
# nothing ever superseded the last, so a run of PRs queued them all against a scarce runner pool:
# on 2026-09-03 a ten-push PR left five stale runs alive going back two hours, one job queued for
# 100 minutes and another wedged 80 minutes inside a step that normally takes 2m19s. They only
# cleared when cancelled by hand.
#
# `cancel-in-progress` is deliberately CONDITIONAL rather than a blanket `true`: superseding a PR
# run is what we want, but cancelling a push to `main` would leave commits on the default branch
# that were never actually tested — and main is the branch whose green history has to mean
# something.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # Skip drafts, never push/dispatch. `test` is the ruleset's required check, and a job skipped by
    # its `if` reports success, so a draft never blocks on it; `ready_for_review` then runs it for real.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: macos-15
    # Bound it, as `red-first` already is. Twice on 2026-09-03/04 this job sat 80+ minutes inside
    # its test step while the other jobs — running the same swift test binary against the same
    # models cache — passed. Without a timeout it runs to GitHub's 6-hour default, so the branch is
    # blocked for a working day on a hang nobody is watching.
    #
    # 30 minutes is ~3.7x the job's measured runtime (483s on the first green run with everything
    # in this PR applied: ~117s build, ~342s serial tests, ~24s setup and caches). It cannot fire
    # on a healthy run, and a timed-out job leaves a log naming the tests that were executing —
    # which is exactly how the hang in this PR was diagnosed after four cancellations produced
    # nothing.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # gitleaks scans the PR's (or push's) commit range
          persist-credentials: false  # nothing in this job pushes

      # The security baseline (secrets + workflow lint) runs as steps of THIS job, not a new job:
      # a second macOS job would re-pay runner start-up for a few seconds of work. They run first so
      # a leaked token or a bad workflow fails in seconds, before the ~8-minute build and suite.
      # Pinned release binaries, sha256-verified (the same versions as fmasi/.github just-ci.yml;
      # gitleaks and actionlint from each release's checksums.txt, zizmor from the release API's
      # asset digest; all verified by download on 2026-09-28). macos-15 runners are arm64.
      - name: Install gitleaks, actionlint and zizmor (pinned, checksum-verified)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: aba9ced2dee8d27fecca3dc7feb1a7f9a52caefa1eb46f3271ea66b6e0e6953f
          ZIZMOR_VERSION: 1.30.1
          ZIZMOR_SHA256: e28d22b087f9ebb8d99da6e740d348c930f559961c7c3f12badda54f882195a2
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          fetch() {  # url sha256 member
            local tgz
            tgz="$RUNNER_TEMP/$(basename "$1")"
            curl -fsSL --retry 3 -o "$tgz" "$1"
            echo "$2  $tgz" | shasum -a 256 -c -
            tar -xzf "$tgz" -C "$bin" "$3"
          }
          fetch "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_darwin_arm64.tar.gz" "$GITLEAKS_SHA256" gitleaks
          fetch "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_darwin_arm64.tar.gz" "$ACTIONLINT_SHA256" actionlint
          fetch "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-aarch64-apple-darwin.tar.gz" "$ZIZMOR_SHA256" zizmor
          echo "$bin" >> "$GITHUB_PATH"

      # Scans ONLY the commits this event brings (PR: base..head, push: before..after), falling back
      # to the full history when there is no usable range (a new branch, a force-push). Same logic
      # as fmasi/.github just-ci.yml. Secrets are redacted in the log; .gitleaksignore is honoured.
      # The pre-commit hook (lefthook) scans staged changes locally; `just ci` does not repeat it.
      - name: Scan for secrets (gitleaks)
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          base="" head=""
          case "$EVENT_NAME" in
            pull_request) base="$PR_BASE_SHA" head="$PR_HEAD_SHA" ;;
            push)         base="$PUSH_BEFORE" head="$PUSH_AFTER" ;;
          esac
          args=(git --no-banner --redact --verbose)
          if [ -n "$base" ] && [ -n "$head" ] && [[ ! "$base" =~ ^0+$ ]] \
             && git cat-file -e "${base}^{commit}" 2>/dev/null \
             && git cat-file -e "${head}^{commit}" 2>/dev/null; then
            echo "Scanning ${base}..${head}"
            args+=(--log-opts="${base}..${head}")
          else
            echo "No usable commit range for '$EVENT_NAME'; scanning the full history."
          fi
          gitleaks "${args[@]}" .

      # `just workflows` runs the same two commands locally (part of `just ci`).
      - name: Lint workflows (actionlint, zizmor)
        env:
          # Read-only token: zizmor's online audits (impostor commits, known-vulnerable actions)
          # query public GitHub data with it.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          actionlint
          zizmor --min-severity high .github/workflows

      # "Green" must not silently mean "not run" (#272). A test inside `#if compiler(>=X)` is not
      # even built by an older Swift, and one that opens with `guard #available(macOS N, *) else
      # { return }` passes on an older macOS without asserting anything. For months that hid ten
      # tests here, one of them the "a transcription never downloads a missing model" airgap test.
      # This step writes the toolchain in use and "N tests not run on this toolchain" to the job
      # summary, and raises a warning annotation when N is not 0. The counter is tested first
      # (a few seconds, a temp fixture): a counter that wrongly says 0 would be worse than none.
      # `just toolchain` runs the same two scripts.
      - name: Report the toolchain and the tests it cannot run
        run: |
          set -euo pipefail
          bash scripts/test-toolchain-report.sh
          bash scripts/toolchain-report.sh | tee -a "$GITHUB_STEP_SUMMARY"

      # SyntheticDiarizationTests (and the metamorphic suite) need the diarization models
      # (~23 MB). The fixture itself is synthesized at test time with `say`, so the models are
      # the ONLY external dependency — cached, they cost nothing; cold, ~6s.
      - name: Cache diarization models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Application Support/FluidAudio/Models
          key: fluidaudio-models-${{ hashFiles('Package.resolved') }}
          restore-keys: fluidaudio-models-

      - name: Cache AMI reference audio
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fixtures/diarization
          # Keyed on the fetch script, not a hand-bumped literal. A static key meant that changing
          # the script's URL or output filename would restore the OLD bytes, the script's
          # already-present guard would skip the download, and CI would silently keep testing
          # against a stale fixture — the kind of failure that reports green.
          # NO restore-keys, deliberately. A prefix fallback would restore the previous fixture
          # whenever the script changes — recreating precisely the stale-fixture failure the derived
          # key exists to prevent, since the script's "already present" guard would then skip the
          # download. An exact-key miss must fall through to a real fetch.
          key: ami-fixture-${{ hashFiles('scripts/fetch-diarization-fixtures.sh') }}

      - name: Cache SwiftPM dependency resolution
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # The git clones and checkouts SPM makes, NOT the compiled output. Measured on a clean
          # run: 26s of the job goes to resolution before a single file is compiled, and 21s of
          # that is one line — `Computed Sparkle at 2.9.4 (21.17s)` — because SPM clones Sparkle's
          # full history and walks its tags to pick a version it already knows from Package.resolved.
          #
          # Compiled output (.build/<triple>/debug, 814 MB) is deliberately NOT cached. It would
          # save ~76s but costs a large transfer, and a stale object surviving into a run of THIS
          # suite would mean a green tick on code that was not actually built.
          #
          # These three are safe to cache because none of them is OUR compiled code: `repositories`
          # and `checkouts` are dependency sources, and `artifacts` holds prebuilt binary targets
          # (Sparkle ships an XCFramework). They are all content addressed by `Package.resolved`,
          # so a stale entry cannot silently stand in for a rebuild of the code under test — the
          # cache key changes the moment a dependency version does.
          path: |
            .build/repositories
            .build/checkouts
            .build/artifacts
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      # Blast radius, stated deliberately: this fetch now gates the whole `test` job, so an
      # unreachable fixture server fails the entire suite rather than just an isolated guard job.
      # Accepted, because `PARLEY_REQUIRE_AMI_FIXTURE=1` means a missing fixture MUST fail loudly —
      # the entire reason that env var exists is that these tests once skipped silently in CI for
      # months while the suite reported green. A fetch failure that merely disabled the guard would
      # recreate exactly that. The fixture is cached above, so the fetch is a no-op on a cache hit.
      - name: Fetch AMI reference audio (4-speaker meeting)
        run: bash scripts/fetch-diarization-fixtures.sh

      # --no-parallel, chosen on EXPECTED cost rather than best-case cost.
      #
      # Raw comparison favours parallel: measured on CI, 127s of tests parallel vs 596s serial.
      # But parallel wedges. A timed-out run showed 27 tests starting within six seconds and none
      # ever finishing — nearly all AVFoundation or CoreML, i.e. clients of shared media XPC
      # daemons, which block every client forever when one gets stuck. Marking only those suites
      # `.serialized` cut the frozen set from 27 to 15 and did NOT stop it: the stall is
      # cross-suite, and different suites still run concurrently.
      #
      # Measured wedge rate over recent runs: 2 in 3. So per run:
      #
      #   parallel   33% x 250s + 67% x (1800s timeout + 250s retry)  = ~1449s
      #   serial     100% x 590s                                       =   590s
      #
      # Serial is ~2.5x cheaper in expectation and, more importantly, deterministic — a 10-minute
      # CI that always finishes beats a 4-minute CI that hangs for half an hour two runs in three.
      # Revisit if the underlying wedge is ever fixed; `timeout-minutes` will keep leaving the logs
      # needed to do that.
      - name: Run Swift tests, including the AMI ground-truth guard
        env:
          # Let model-needing tests download for themselves. On CI a missing model is a test
          # FAILURE, never a silent skip (see SwiftTests/TranscriberTests/Support/TestModels.swift).
          PARLEY_FETCH_MODELS: "1"
          # A skip is a failure: with this set, a missing fixture or model FAILS the ground-truth
          # tests instead of disabling them, and `guardJobCannotSkip` proves their preconditions
          # held (see DiarizationRegressionTests).
          PARLEY_REQUIRE_AMI_FIXTURE: "1"
        run: |
          swift test --no-parallel --filter TranscriberTests \
            -Xswiftc -F/Library/Developer/CommandLineTools/Library/Developer/Frameworks/ \
            -Xlinker -rpath -Xlinker /Library/Developer/CommandLineTools/Library/Developer/Frameworks/ \
            -Xlinker -rpath -Xlinker /Library/Developer/CommandLineTools/Library/Developer/usr/lib/

      # The release tooling (appcast, release notes, publish.sh, the Sparkle feed verifier). A break
      # here ships a broken auto-update feed, which every installed client fails silently. Stdlib
      # Python + bash only, a few seconds; it runs after the suite so verify-ed-signature reuses the
      # debug build. `just release-tools` runs the same three commands.
      - name: Test the release tooling
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts -p 'test_*.py'
          bash scripts/test-publish.sh
          bash scripts/test-verify-release-feed.sh

  # Red-first gate: the PR's changed tests must FAIL at the merge base and PASS at HEAD.
  #
  # A regression test that is green BEFORE the fix it claims to guard proves nothing — it guards
  # dead code (TranscriptMerger: 6 passing tests, zero production bytes shipped), asserts nothing,
  # or silently skips (the AMI diarization guard in CI). This job checks out the merge base,
  # overlays only the PR's changed test files, and requires them to be RED there and GREEN at
  # HEAD. Tests-only PRs and files marked 'RED-FIRST-EXEMPT: <reason>' pass trivially — see the
  # comment block in scripts/verify-regression-tests.sh for the full semantics.
  red-first:
    if: github.event_name == 'pull_request' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # the gate diffs against, and checks out, the merge base

      # The same report as in `test` (see the comment there): this job builds and runs tests with
      # the same toolchain, so its summary says which one, and what that toolchain cannot run.
      - name: Report the toolchain and the tests it cannot run
        run: |
          set -euo pipefail
          bash scripts/toolchain-report.sh | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Cache diarization models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Application Support/FluidAudio/Models
          key: fluidaudio-models-${{ hashFiles('Package.resolved') }}
          restore-keys: fluidaudio-models-

      - name: Cache SwiftPM dependency resolution
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # The git clones and checkouts SPM makes, NOT the compiled output. Measured on a clean
          # run: 26s of the job goes to resolution before a single file is compiled, and 21s of
          # that is one line — `Computed Sparkle at 2.9.4 (21.17s)` — because SPM clones Sparkle's
          # full history and walks its tags to pick a version it already knows from Package.resolved.
          #
          # Compiled output (.build/<triple>/debug, 814 MB) is deliberately NOT cached. It would
          # save ~76s but costs a large transfer, and a stale object surviving into a run of THIS
          # suite would mean a green tick on code that was not actually built.
          #
          # These three are safe to cache because none of them is OUR compiled code: `repositories`
          # and `checkouts` are dependency sources, and `artifacts` holds prebuilt binary targets
          # (Sparkle ships an XCFramework). They are all content addressed by `Package.resolved`,
          # so a stale entry cannot silently stand in for a rebuild of the code under test — the
          # cache key changes the moment a dependency version does.
          path: |
            .build/repositories
            .build/checkouts
            .build/artifacts
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      # KNOWN GAP: this job does not fetch the AMI fixture or set PARLEY_REQUIRE_AMI_FIXTURE, so
      # DiarizationRegressionTests SKIP here. The gate counts a skip as PASSED
      # (verify-regression-tests.sh: "a skipped test counts as passed"), so a PR that fixes a
      # diarization bug and adds a test for it gets RUN_STATUS=green at the merge base and the gate
      # FAILS with "the changed tests PASS at the parent commit" — a false failure that blocks a
      # legitimate PR, not a false pass. Loud rather than silent, but wrong either way.
      #
      # Workaround until it is fixed: mark such a test `RED-FIRST-EXEMPT: <reason>`, which is what
      # that marker exists for. Fixing it properly means fetching the fixture and paying the AMI
      # compute in a second job, which is the duplication this PR removes — so it is recorded here
      # and in docs/development-process.md rather than silently carried.
      - name: Changed tests must be RED at the merge base, GREEN at HEAD
        env:
          # Gated suites may include model-needing tests; without this they would fail at HEAD
          # for the wrong reason (missing models, not a missing fix).
          PARLEY_FETCH_MODELS: "1"
          # Through env, not `${{ }}` inside the script: zizmor's template-injection rule (high).
          BASE_REF: ${{ github.base_ref }}
        run: |
          BASE=$(git merge-base "origin/$BASE_REF" HEAD)
          bash scripts/verify-regression-tests.sh "$BASE"

  # NOTE: there is no separate `diarization-guard` job any more. `DiarizationRegressionTests` lives
  # in the `TranscriberTests` target, so the `test` job above already BUILDS it and — now that the
  # AMI fixture is fetched and PARLEY_REQUIRE_AMI_FIXTURE is set there — already RUNS it. The old
  # job was a second full build of the same package (measured: 325s of its 416s was build and
  # dependency resolution) to run tests the first job had already compiled. Coverage is unchanged;
  # `guardJobCannotSkip` still proves the ground-truth assertions cannot silently no-op.
