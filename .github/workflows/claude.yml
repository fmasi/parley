name: Claude

# `@claude` in a comment, review or new issue. The reusable workflow in
# fmasi/.github holds the gate: the text must mention @claude AND the author must
# be an OWNER, MEMBER or COLLABORATOR, so a stranger on this public repo can't
# spend the token. A skipped run is free.

"on":
  issue_comment: { types: [created] }
  pull_request_review_comment: { types: [created] }
  pull_request_review: { types: [submitted] }
  issues: { types: [opened] }

jobs:
  claude:
    uses: fmasi/.github/.github/workflows/claude-mention.yml@main
    permissions: { contents: write, pull-requests: write, issues: write, id-token: write, actions: read }
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
